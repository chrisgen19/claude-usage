name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the script's own VERSION means
      # `claude-usage version` would lie to everyone who installs it.
      - name: Tag matches VERSION in claude-usage
        run: |
          tag="${GITHUB_REF_NAME#v}"
          script=$(sed -n 's/^VERSION=\(.*\)$/\1/p' claude-usage | head -1)
          echo "tag=$tag script=$script"
          if ! printf '%s' "$script" | grep -qE '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$'; then
            echo "::error::VERSION=$script in claude-usage is not a valid X.Y.Z"
            exit 1
          fi
          if [ "$tag" != "$script" ]; then
            echo "::error::tag v$tag does not match VERSION=$script in claude-usage"
            exit 1
          fi

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint before publishing
        run: |
          shellcheck --severity=style --format=gcc claude-usage scripts/bump scripts/selftest
          bash -n claude-usage

      # Tag pushes do not trigger ci.yml, and GitHub does not make this job wait
      # on the run for the same commit on main. Without this step a tag could
      # publish a build that leaks a login into the cache. Run the suite here.
      - name: Self test before publishing
        run: ./scripts/selftest

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            claude-usage
